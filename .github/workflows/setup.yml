name: Extract and build Filz Lenz

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract the uploaded zip, flatten to repo root
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repo root — nothing to extract."
            exit 0
          fi
          echo "Found: $ZIP_FILE"
          mkdir extracted_tmp
          unzip -q "$ZIP_FILE" -d extracted_tmp
          shopt -s dotglob
          TOPLEVEL=($(ls extracted_tmp))
          if [ "${#TOPLEVEL[@]}" -eq 1 ] && [ -d "extracted_tmp/${TOPLEVEL[0]}" ]; then
            mv "extracted_tmp/${TOPLEVEL[0]}"/* ./
          else
            mv extracted_tmp/* ./
          fi
          rm -rf extracted_tmp
          rm -f "$ZIP_FILE"
          echo "--- resulting root ---"
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Commit corrected structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Filz Lenz zip, flatten to repo root, verified build" || echo "Nothing to commit"
          git push